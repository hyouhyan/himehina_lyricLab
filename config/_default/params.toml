# Pages placed under these sections will be shown on homepage and archive page.
mainSections = ["post"]
# Output page's full content in RSS.
rssFullContent = true
favicon = "/favicon.ico"

[footer]
since = 2024
customText = "本サイトは非公式のファンサイトです。<br>Made by <a href='https://x.com/hyouhyan'>Hyouhyan</a>"

[dateFormat]
published = "2006年 01月 02日"
lastUpdated = "2006年 01月 02日 15:04"

[sidebar]
emoji = "🥕"
subtitle = "ヒメヒナ楽曲の歌詞をパート分けして掲載してます"

[sidebar.avatar]
enabled = true
local = true
src = "img/hy_icon-150.png"

[article]
headingAnchor = false
math = false
readingTime = false

[article.license]
enabled = false
default = "Licensed under CC BY-NC-SA 4.0"

## Widgets
[[widgets.homepage]]
type = "search"

[[widgets.homepage]]
type = "categories"

[widgets.homepage.params]
limit = 10

[[widgets.homepage]]
type = "tag-cloud"

[widgets.homepage.params]
limit = 10

[[widgets.page]]
type = "toc"

[opengraph.twitter]
site = ""
card = "summary_large_image"

[defaultImage.opengraph]
enabled = false
local = false
src = ""

[colorScheme]
toggle = true
default = "auto"

[imageProcessing.cover]
enabled = true

[imageProcessing.content]
enabled = true

